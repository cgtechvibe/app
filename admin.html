<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Olla Apps Admin</title>
    <meta name="theme-color" content="#121212">
    <script src="admin-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --cw: 720px; }
        html, body {
            background: #121212; color: #e0e0e0;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100%;
        }
        body { padding: 24px 16px 48px; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            max-width: var(--cw); margin: 0 auto 20px; width: 100%;
        }
        .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
        .header .mini { color: #888; font-size: 12.5px; margin-top: 2px; }
        .panel { max-width: var(--cw); margin: 0 auto; width: 100%; }

        .card {
            background: #1e1e2a; border: 1px solid #2c2c3a;
            border-radius: 16px; padding: clamp(14px, 3vw, 20px); margin-bottom: 14px;
        }
        .card h2 { font-size: 15.5px; font-weight: 600; margin-bottom: 14px; }

        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 12.5px; color: #9a9ab0; margin-bottom: 5px; }
        .field input[type="text"], .field input[type="url"], .field input[type="password"] {
            width: 100%; padding: 11px 12px; border-radius: 10px;
            border: 1px solid #33334a; background: #16161f; color: #fff; font-size: 14.5px;
        }
        .field input:focus { outline: none; border-color: #5a5a78; }
        .field .hint { font-size: 11px; color: #666; margin-top: 4px; }

        .btn {
            padding: 12px 16px; border-radius: 10px; border: none;
            background: #7c6cff; color: #fff; font-size: 14.5px; font-weight: 600;
            cursor: pointer; width: 100%;
        }
        .btn:hover { background: #8d7fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.gray { background: #2c2c3a; color: #ddd; }
        .btn.small { width: 100%; padding: 9px 6px; font-size: 12.5px; border-radius: 8px; }
        .btn.danger { background: #b3384a; }
        .btn.danger:hover { background: #c34657; }

        /* Client list rows — name+desc on top spanning full width, actions below */
        .row {
            background: #181822; border: 1px solid #27273a;
            border-radius: 14px; padding: 14px; margin-bottom: 10px;
        }
        .row-top { display: flex; align-items: center; gap: 13px; }
        .row .thumb { width: 46px; height: 46px; border-radius: 11px; overflow: hidden; background: #24243a; flex-shrink: 0; }
        .row .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .row .meta { flex: 1; min-width: 0; }
        .row .meta .name { font-size: 16px; font-weight: 600; line-height: 1.2; }
        .row .meta .sub { font-size: 12.5px; color: #8a8aa0; margin-top: 2px; overflow-wrap: anywhere; }
        .row .meta .tag { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 99px; margin-top: 6px; }
        .row .meta .tag.on { background: #1d3a2a; color: #6fc46f; }
        .row .meta .tag.off { background: #3a2424; color: #e07b7b; }
        .row .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 13px; }

        #status, #status2, #status3 { text-align: center; font-size: 13px; margin-top: 10px; min-height: 18px; }
        .ok { color: #6fc46f; }
        .err { color: #e07b7b; }
        .hidden { display: none !important; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
        .stat { background: #181822; border: 1px solid #27273a; border-radius: 14px; padding: 13px; text-align: center; }
        .stat .n { font-size: 24px; font-weight: 700; }
        .stat .l { font-size: 11.5px; color: #8a8aa0; margin-top: 2px; }

        .upload { display: flex; align-items: center; gap: 10px; }
        .upload .box {
            width: 48px; height: 48px; border-radius: 10px; overflow: hidden;
            background: #16161f; border: 1px dashed #3a3a50;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: #666; text-align: center; flex-shrink: 0;
        }
        .upload .box img { width: 100%; height: 100%; object-fit: cover; }
        .upload input[type="file"] { font-size: 11.5px; color: #ccc; max-width: 100%; }
        .upload input[type="file"]::file-selector-button {
            background: #26263a; color: #ddd; border: 1px solid #3a3a50;
            padding: 7px 10px; border-radius: 8px; margin-right: 8px; cursor: pointer;
        }
        .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #2a2a3a; border: 1px solid #444; color: #eee; padding: 10px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 50; }

        .header-btns { display: flex; gap: 8px; align-items: center; }

        /* Add-client modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 60;
            background: rgba(0, 0, 0, 0.62);
            display: flex; align-items: flex-end; justify-content: center;
        }
        @media (min-width: 600px) { .modal-overlay { align-items: center; } }
        .modal {
            background: #1e1e2a; border: 1px solid #2c2c3a; border-radius: 16px 16px 0 0;
            width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
            padding: clamp(16px, 3vw, 22px);
        }
        @media (min-width: 600px) { .modal { border-radius: 16px; } }
        .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .modal-head h2 { font-size: 16px; font-weight: 600; }
        .modal-close {
            background: #26263a; border: 1px solid #3a3a50; color: #ccc;
            width: 32px; height: 32px; border-radius: 8px; font-size: 18px; line-height: 1;
            cursor: pointer;
        }
        .modal-close:hover { background: #33334a; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 id="title">Admin Panel</h1>
            <div class="mini">Manage PWA clients</div>
        </div>
        <div class="header-btns hidden" id="headerBtns">
            <button class="btn small" id="addClientBtn" style="width:auto; padding:9px 14px;">+ Add</button>
            <button class="btn small gray" id="logOutBtn" style="width:auto; padding:9px 14px;">Log Out</button>
        </div>
    </div>

    <div class="panel">
        <!-- LOGIN -->
        <div id="loginView" class="card">
            <h2>Login</h2>
            <div class="field">
                <label>PIN</label>
                <input type="password" id="pinInput" placeholder="Enter PIN" inputmode="numeric">
            </div>
            <div class="field">
                <label>GitHub Token (PAT)</label>
                <input type="password" id="tokenInput" placeholder="Enter token / leave blank if saved">
                <div class="hint">Token is stored on this device after the first login.</div>
            </div>
            <button class="btn" id="loginBtn">Open Panel</button>
            <div id="status"></div>
        </div>

        <!-- ADMIN -->
        <div id="adminView" class="hidden">
            <div class="stats">
                <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Total</div></div>
                <div class="stat"><div class="n" id="stVisible">0</div><div class="l">Visible</div></div>
                <div class="stat"><div class="n" id="stHidden">0</div><div class="l">Hidden</div></div>
            </div>

            <!-- Clients -->
            <div class="card">
                <h2>Clients</h2>
                <div class="field">
                    <input type="text" id="searchClient" placeholder="Search by name, path, client or phone…" autocomplete="off">
                </div>
                <div id="clientList"></div>
            </div>

            <!-- Edit client (hidden) -->
            <div class="card hidden" id="editCard">
                <h2 id="editTitle">Edit Client</h2>
                <div class="field">
                    <label>System Name</label>
                    <input type="text" id="eName">
                </div>
                <div class="field">
                    <label>Description</label>
                    <input type="text" id="eDesc">
                </div>
                <div class="field">
                    <label>Client Name</label>
                    <input type="text" id="eClientName" placeholder="e.g. Ahmad bin Ali">
                </div>
                <div class="field">
                    <label>Phone Number</label>
                    <input type="tel" id="ePhone" placeholder="e.g. 012-3456789" inputmode="tel">
                </div>
                <div class="field">
                    <label>GAS Exec URL</label>
                    <input type="url" id="eUrl">
                </div>
                <div class="field">
                    <label>Icon (leave empty to keep current)</label>
                    <div class="upload">
                        <div class="box" id="editIconPreview">Preview</div>
                        <input type="file" id="eIcon" accept="image/*">
                    </div>
                </div>
                <div style="display:flex; gap:8px; margin-top:6px;">
                    <button class="btn" id="eSaveBtn" style="flex:1;">Save</button>
                    <button class="btn gray" id="eCancelBtn" style="flex:1;">Cancel</button>
                </div>
                <div id="status3"></div>
            </div>
        </div>

        <div class="msg hidden" id="workingMsg" style="text-align:center; color:#aaa; margin:14px 0; font-size:13.5px;">Updating GitHub… don't close the tab</div>
    </div>

    <!-- Add New Client modal -->
    <div class="modal-overlay hidden" id="addModal">
        <div class="modal">
            <div class="modal-head">
                <h2>Add New Client</h2>
                <button class="modal-close" id="closeAddModal" aria-label="Close">×</button>
            </div>
            <div class="field">
                <label>System Name</label>
                <input type="text" id="fName" placeholder="e.g. BNBMan">
            </div>
            <div class="field">
                <label>Description</label>
                <input type="text" id="fDesc" placeholder="e.g. Homestay management">
            </div>
            <div class="field">
                <label>Client Name</label>
                <input type="text" id="fClientName" placeholder="e.g. Ahmad bin Ali">
            </div>
            <div class="field">
                <label>Phone Number</label>
                <input type="tel" id="fPhone" placeholder="e.g. 012-3456789" inputmode="tel">
            </div>
            <div class="field">
                <label>Folder Path</label>
                <input type="text" id="fPath" placeholder="e.g. bnb2 (lowercase letters/numbers/-/_ only)">
                <div class="hint">Link becomes .../famtree/&lt;path&gt;/</div>
            </div>
            <div class="field">
                <label>GAS Exec URL</label>
                <input type="url" id="fUrl" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            <div class="field">
                <label>Icon (1 image — auto resize to 192 &amp; 512)</label>
                <div class="upload">
                    <div class="box" id="addIconPreview">Preview</div>
                    <input type="file" id="fIcon" accept="image/*">
                </div>
            </div>
            <button class="btn" id="addBtn">Add Client</button>
            <div id="status2"></div>
        </div>
    </div>

    <script>
    // ===== CONFIG =====
    var CFG = window.ADMIN_CONFIG || { owner: '', repo: '', branch: 'main', token: '', pin: '' };
    var LS_TOKEN_KEY = 'olla_admin_token';
    var O = {
        owner: CFG.OWNER, repo: CFG.REPO, branch: CFG.BRANCH || 'main',
        pin: CFG.PIN || ''
    };
    var token = '';
    try { token = localStorage.getItem(LS_TOKEN_KEY) || ''; } catch (e) {}

    document.getElementById('title').textContent = CFG.TITLE || 'Admin Panel';
    if (token) document.getElementById('tokenInput').setAttribute('placeholder', 'Token saved — leave blank');

    var state = { list: null, editingId: null, addIcon: null, editIcon: null };

    // ===== UTIL =====
    function b64decode(b64) {
        var bin = atob(b64.replace(/\s/g, ''));
        var out = '';
        for (var i = 0; i < bin.length; i++) out += String.fromCharCode(bin.charCodeAt(i) & 0xff);
        try { return decodeURIComponent(escape(out)); } catch (e) { return out; }
    }
    function resizeImage(file, size) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    canvas.width = size; canvas.height = size;
                    var ctx = canvas.getContext('2d');
                    var s = Math.min(img.width, img.height);
                    var sx = (img.width - s) / 2, sy = (img.height - s) / 2;
                    ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }
    function toast(msg) {
        var t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, 2200);
    }

    // ===== GITHUB API =====
    function gh(method, path, body, opts) {
        var headers = { 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
        // This repo is PUBLIC: reading files needs no token. Only send a token
        // when it exists AND the call is not a public read. A stale/revoked
        // token makes GitHub answer 401 even for public repos, so we skip it.
        if (!(opts && opts.public) && token) headers['Authorization'] = 'token ' + token;
        return fetch('https://api.github.com/repos/' + O.owner + '/' + O.repo + path, {
            method: method,
            headers: headers,
            body: body ? JSON.stringify(body) : undefined
        }).then(function (r) {
            if (!r.ok) return r.json().then(function (e) { throw new Error((e && e.message) || ('HTTP ' + r.status)); });
            return r.status === 204 ? null : r.json();
        });
    }
    function getList() {
        // Read list.json without auth — always succeeds for a public repo,
        // even if the stored token is old or revoked. Cache-buster defeats
        // GitHub CDN serving stale content right after a commit.
        return gh('GET', '/contents/list.json?ref=' + O.branch + '&_=' + Date.now(), null, { public: true }).then(function (d) {
            state.list = JSON.parse(b64decode(d.content));
            return state.list;
        });
    }
    function commitAll(files, deletes, message) {
        return gh('GET', '/git/ref/heads/' + O.branch).then(function (baseRef) {
            var baseSha = baseRef.object.sha;
            var blobJobs = (files || []).map(function (f) {
                return gh('POST', '/git/blobs', { content: f.content, encoding: f.binary ? 'base64' : 'utf-8' })
                    .then(function (b) { return { path: f.path, mode: '100644', type: 'blob', sha: b.sha }; });
            });
            return Promise.all(blobJobs).then(function (entries) {
                (deletes || []).forEach(function (p) { entries.push({ path: p, mode: '100644', type: 'blob', sha: null }); });
                return gh('POST', '/git/trees', { base_tree: baseSha, tree: entries });
            }).then(function (t) {
                return gh('POST', '/git/commits', { message: message, tree: t.sha, parents: [baseSha] });
            }).then(function (c) {
                return gh('PATCH', '/git/refs/heads/' + O.branch, { sha: c.sha, force: false });
            });
        });
    }
    function commitList(message, extraFiles, deletes) {
        var files = extraFiles || [];
        files.push({ path: 'list.json', content: JSON.stringify(state.list, null, 2), binary: false });
        return commitAll(files, deletes, message);
    }

    // ===== LOGIN =====
    document.getElementById('loginBtn').addEventListener('click', function () {
        var p = document.getElementById('pinInput').value;
        var t = document.getElementById('tokenInput').value || token;
        var status = document.getElementById('status');
        if (O.pin && p !== O.pin) { status.className = 'err'; status.textContent = 'PIN incorrect.'; return; }
        if (!t) { status.className = 'err'; status.textContent = 'GitHub token required.'; return; }

        // Verify token first (GET /repos = public read, no write) before entering
        status.className = ''; status.textContent = 'Verifying token…';
        fetch('https://api.github.com/repos/' + O.owner + '/' + O.repo, {
            headers: { 'Authorization': 'token ' + t, 'Accept': 'application/vnd.github.v3+json' }
        }).then(function (r) {
            if (r.status === 401 || r.status === 403) {
                status.className = 'err';
                status.textContent = 'Invalid or expired token. Enter a new correct token.';
                return null;
            }
            if (!r.ok) return r.json().then(function (e) { throw new Error((e && e.message) || ('HTTP ' + r.status)); });
            return true;
        }).then(function (ok) {
            if (ok !== true) return;
            token = t;
            try { localStorage.setItem(LS_TOKEN_KEY, t); } catch (e) {}
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('adminView').classList.remove('hidden');
            document.getElementById('headerBtns').classList.remove('hidden');
            document.getElementById('status').textContent = '';
            refreshAll();
        }).catch(function (err) {
            status.className = 'err';
            status.textContent = 'Login error: ' + err.message;
        });
    });
    document.getElementById('logOutBtn').addEventListener('click', function () {
        document.getElementById('adminView').classList.add('hidden');
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('headerBtns').classList.add('hidden');
        closeAddModal();
    });

    // ===== ADD MODAL =====
    function openAddModal() {
        document.getElementById('addModal').classList.remove('hidden');
        setTimeout(function () { document.getElementById('fName').focus(); }, 50);
    }
    function closeAddModal() {
        document.getElementById('addModal').classList.add('hidden');
        var st = document.getElementById('status2');
        st.className = ''; st.textContent = '';
    }
    document.getElementById('addClientBtn').addEventListener('click', openAddModal);
    document.getElementById('closeAddModal').addEventListener('click', closeAddModal);
    document.getElementById('addModal').addEventListener('click', function (e) {
        if (e.target === this) closeAddModal();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeAddModal();
    });

    function busy(on, text) {
        var w = document.getElementById('workingMsg');
        if (on) { w.textContent = text || 'Updating GitHub… don\'t close the tab'; w.classList.remove('hidden'); }
        else w.classList.add('hidden');
    }
    function run(op, onOk) {
        busy(true);
        op.then(function () { busy(false); onOk && onOk(); })
            .catch(function (err) { busy(false); toast('Error: ' + err.message); });
    }

    // ===== DASHBOARD =====
    function render() {
        var list = state.list;
        if (!list) return;
        var clients = list.clients || [];
        document.getElementById('stTotal').textContent = clients.length;
        document.getElementById('stVisible').textContent = clients.filter(function (c) { return c.visible !== false; }).length;
        document.getElementById('stHidden').textContent = clients.filter(function (c) { return c.visible === false; }).length;

        var base = location.pathname.replace(/\/[^\/]*$/, '/');
        var origin = location.origin;

        var q = (document.getElementById('searchClient').value || '').trim().toLowerCase();
        var shown = clients.filter(function (c) {
            if (!q) return true;
            var hay = ((c.name || '') + ' ' + (c.path || '') + ' ' + (c.clientName || '') + ' ' + (c.phone || '')).toLowerCase();
            return hay.indexOf(q) !== -1;
        });

        var html = '';
        if (!shown.length) html = '<div class="sub" style="color:#8a8aa0;font-size:13px;">' + (clients.length ? 'No matches.' : 'No clients yet.') + '</div>';
        shown.forEach(function (c) {
            var icon = c.icon ? (c.icon.indexOf('http') === 0 ? c.icon : origin + base + c.icon.replace(/^\.?\//, '')) : origin + base + 'icon-192.png';
            var on = c.visible !== false;
            var contact = '';
            if (c.clientName || c.phone) {
                var bits = [];
                if (c.clientName) bits.push(c.clientName);
                if (c.phone) bits.push(c.phone);
                contact = '<div class="sub">' + bits.join(' · ') + '</div>';
            }
            html += '<div class="row">' +
                '<div class="row-top">' +
                    '<div class="thumb"><img src="' + icon + '" alt=""></div>' +
                    '<div class="meta">' +
                        '<div class="name">' + (c.name || 'App') + '</div>' +
                        '<div class="sub">' + (c.path || '') + (c.description ? ' · ' + c.description : '') + '</div>' +
                        contact +
                        '<span class="tag ' + (on ? 'on' : 'off') + '">' + (on ? 'Visible' : 'Hidden') + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="acts">' +
                    '<button class="btn small" data-act="open" data-id="' + c.id + '">Open</button>' +
                    '<button class="btn small gray" data-act="toggle" data-id="' + c.id + '">' + (on ? 'Hide' : 'Show') + '</button>' +
                    '<button class="btn small gray" data-act="edit" data-id="' + c.id + '">Edit</button>' +
                    '<button class="btn small danger" data-act="del" data-id="' + c.id + '">Delete</button>' +
                '</div>' +
            '</div>';
        });
        document.getElementById('clientList').innerHTML = html;
    }

    function refreshAll() {
        getList().then(render).catch(function (err) {
            document.getElementById('clientList').innerHTML =
                '<div class="sub" style="color:#e07b7b;font-size:13px;">Error: ' + (err.message || 'unknown') + '</div>';
            toast('Error loading list: ' + err.message);
        });
    }

    // Live filter as the user types
    document.getElementById('searchClient').addEventListener('input', function () {
        if (state.list) render();
    });

    // ===== ACTIONS =====
    document.getElementById('clientList').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act]');
        if (!btn) return;
        var act = btn.getAttribute('data-act');
        var id = btn.getAttribute('data-id');
        if (act === 'open') {
            var c = state.list.clients.find(function (x) { return x.id === id; });
            var base = location.pathname.replace(/\/[^\/]*$/, '/');
            window.open(location.origin + base + c.path + '/');
        } else if (act === 'toggle') toggleClient(id);
        else if (act === 'edit') openEdit(id);
        else if (act === 'del') deleteClient(id);
    });

    function toggleClient(id) {
        var c = state.list.clients.find(function (x) { return x.id === id; });
        if (!c) return;
        c.visible = (c.visible === false) ? true : false;
        run(commitList('Toggle client: ' + c.name), refreshAll);
    }

    function deleteClient(id) {
        var c = state.list.clients.find(function (x) { return x.id === id; });
        if (!c) return;
        if (!confirm('Delete client "' + c.name + '" and all files in /' + c.path + '/ ?')) return;
        var deletes = [c.path + '/index.html', c.path + '/manifest.json', c.path + '/sw.js', c.path + '/icon-192.png', c.path + '/icon-512.png'];
        state.list.clients = state.list.clients.filter(function (x) { return x.id !== id; });
        run(commitList('Delete client: ' + c.name, null, deletes), refreshAll);
    }

    // ===== ADD =====
    function buildClientFiles(path, name, url, icon192, icon512) {
        var indexHtml =
            '<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n' +
            '    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">\n' +
            '    <title>' + name + '</title>\n    <link rel="manifest" href="manifest.json">\n' +
            '    <meta name="theme-color" content="#121212">\n' +
            '    <meta name="mobile-web-app-capable" content="yes">\n' +
            '    <meta name="apple-mobile-web-app-capable" content="yes">\n' +
            '    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n' +
            '    <link rel="apple-touch-icon" href="icon-192.png">\n    <style>\n' +
            '        * { margin: 0; padding: 0; box-sizing: border-box; }\n' +
            '        html, body { width: 100%; height: 100%; overflow: hidden; background: #121212; }\n' +
            '        #app { position: fixed; inset: 0; }\n' +
            '        #app iframe { width: 100%; height: 100%; border: none; display: block; }\n' +
            '    </style>\n</head>\n<body>\n    <div id="app">\n' +
            '        <iframe src="' + url + '" allow="camera; microphone; geolocation"></iframe>\n    </div>\n' +
            '    <script>\n        window.addEventListener("load", function () {\n' +
            '            if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});\n' +
            '        });\n    <\/script>\n</body>\n</html>\n';
        var manifest = {
            name: name, short_name: name, description: '',
            start_url: './index.html', scope: './', display: 'standalone',
            background_color: '#121212', theme_color: '#121212', orientation: 'portrait-primary',
            icons: [
                { src: 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
                { src: 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
                { src: 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ]
        };
        var sw = [
            'const CACHE_NAME = \'pwa-wrapper-v1\';',
            'const ASSETS = [\'./\', \'./index.html\', \'./manifest.json\', \'./icon-192.png\', \'./icon-512.png\'];',
            '',
            "self.addEventListener('install', (e) => { e.waitUntil(caches.open(CACHE_NAME).then((c) => c.addAll(ASSETS)).then(() => self.skipWaiting())); });",
            '',
            "self.addEventListener('activate', (e) => { e.waitUntil(caches.keys().then((ks) => Promise.all(ks.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))).then(() => self.clients.claim())); });",
            '',
            "self.addEventListener('fetch', (e) => { if (!e.request.url.startsWith(self.location.origin)) return; e.respondWith(fetch(e.request).then((r) => { const c = r.clone(); caches.open(CACHE_NAME).then((ca) => ca.put(e.request, c)); return r; }).catch(() => caches.match(e.request))); });"
        ].join('\n');
        return [
            { path: path + '/index.html', content: indexHtml },
            { path: path + '/manifest.json', content: JSON.stringify(manifest, null, 2) },
            { path: path + '/sw.js', content: sw },
            { path: path + '/icon-192.png', content: icon192, binary: true },
            { path: path + '/icon-512.png', content: icon512, binary: true }
        ];
    }

    document.getElementById('fIcon').addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        Promise.all([resizeImage(file, 192), resizeImage(file, 512)]).then(function (r) {
            state.addIcon = { small: r[0], large: r[1] };
            document.getElementById('addIconPreview').innerHTML = '<img src="' + r[0] + '" alt="icon">';
        }).catch(function () { state.addIcon = null; });
    });

    document.getElementById('addBtn').addEventListener('click', function () {
        var name = document.getElementById('fName').value.trim();
        var desc = document.getElementById('fDesc').value.trim();
        var cname = document.getElementById('fClientName').value.trim();
        var ph = document.getElementById('fPhone').value.trim();
        var path = document.getElementById('fPath').value.trim().toLowerCase();
        var url = document.getElementById('fUrl').value.trim();
        var st = document.getElementById('status2');
        st.className = ''; st.textContent = '';
        if (!name || !path || !url) { st.className = 'err'; st.textContent = 'Enter name, path & GAS URL.'; return; }
        if (!/^[a-z0-9\-_]+$/.test(path)) { st.className = 'err'; st.textContent = 'Path: lowercase letters, numbers, -, _ only (no spaces).'; return; }
        if (!state.addIcon) { st.className = 'err'; st.textContent = 'Select an icon first.'; return; }
        if ((state.list.clients || []).some(function (c) { return c.id === path; })) { st.className = 'err'; st.textContent = 'Path/ID already exists.'; return; }

        var files = buildClientFiles(path, name, url, state.addIcon.small.split(',')[1], state.addIcon.large.split(',')[1]);
        state.list.clients.push({ id: path, path: path, name: name, description: desc, clientName: cname, phone: ph, icon: './' + path + '/icon-192.png', url: url, visible: true });
        files.push({ path: 'list.json', content: JSON.stringify(state.list, null, 2), binary: false });

        run(commitAll(files, null, 'Add client: ' + name), function () {
            var base = location.pathname.replace(/\/[^\/]*$/, '/');
            st.className = 'ok';
            st.textContent = 'Client "' + name + '" added! Link: ' + location.origin + base + path + '/';
            document.getElementById('fName').value = ''; document.getElementById('fDesc').value = '';
            document.getElementById('fClientName').value = ''; document.getElementById('fPhone').value = '';
            document.getElementById('fPath').value = ''; document.getElementById('fUrl').value = '';
            document.getElementById('fIcon').value = ''; state.addIcon = null;
            document.getElementById('addIconPreview').textContent = 'Preview';
            toast('Client "' + name + '" added');
            closeAddModal();
            refreshAll();
        });
    });

    // ===== EDIT =====
    function openEdit(id) {
        var c = state.list.clients.find(function (x) { return x.id === id; });
        if (!c) return;
        state.editingId = id;
        document.getElementById('editTitle').textContent = 'Edit: ' + c.name;
        document.getElementById('eName').value = c.name || '';
        document.getElementById('eDesc').value = c.description || '';
        document.getElementById('eClientName').value = c.clientName || '';
        document.getElementById('ePhone').value = c.phone || '';
        document.getElementById('eUrl').value = c.url || '';
        document.getElementById('eIcon').value = '';
        state.editIcon = null;
        document.getElementById('editIconPreview').textContent = 'Preview';
        document.getElementById('status3').className = ''; document.getElementById('status3').textContent = '';
        document.getElementById('editCard').classList.remove('hidden');
        document.getElementById('editCard').scrollIntoView({ behavior: 'smooth' });
    }
    document.getElementById('eIcon').addEventListener('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        Promise.all([resizeImage(file, 192), resizeImage(file, 512)]).then(function (r) {
            state.editIcon = { small: r[0], large: r[1] };
            document.getElementById('editIconPreview').innerHTML = '<img src="' + r[0] + '" alt="icon">';
        }).catch(function () { state.editIcon = null; });
    });
    document.getElementById('eSaveBtn').addEventListener('click', function () {
        var c = state.list.clients.find(function (x) { return x.id === state.editingId; });
        if (!c) return;
        var name = document.getElementById('eName').value.trim() || c.name;
        var desc = document.getElementById('eDesc').value.trim();
        var cname = document.getElementById('eClientName').value.trim();
        var ph = document.getElementById('ePhone').value.trim();
        var url = document.getElementById('eUrl').value.trim() || c.url;
        c.name = name; c.description = desc; c.clientName = cname; c.phone = ph; c.url = url;

        var extra = [];
        if (state.editIcon) {
            extra.push({ path: c.path + '/icon-192.png', content: state.editIcon.small.split(',')[1], binary: true });
            extra.push({ path: c.path + '/icon-512.png', content: state.editIcon.large.split(',')[1], binary: true });
        }
        run(commitList('Update client: ' + name, extra), function () {
            document.getElementById('editCard').classList.add('hidden');
            toast('Client "' + name + '" updated');
            render();
            refreshAll();
        });
    });
    document.getElementById('eCancelBtn').addEventListener('click', function () {
        document.getElementById('editCard').classList.add('hidden');
        state.editingId = null; state.editIcon = null;
    });
    </script>
</body>
</html>
