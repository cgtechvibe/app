<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Launcher</title>
    <meta name="theme-color" content="#121212">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .msg { text-align: center; font-size: 15px; opacity: 0.8; padding: 20px; }
    </style>
</head>
<body>
    <div class="msg">Opening app…</div>
    <script>
        (function () {
            // Base = direktori tempat index.html ni hidup (cth /famtree/ atau /PWA/)
            var base = location.pathname.replace(/\/[^\/]*$/, '/');
            // Default: client pertama, fallback gunakan path dari list.json
            var target = base + 'alpha/';
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', base + 'list.json', false);
                xhr.onreadystatechange = function () {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        var data = JSON.parse(xhr.responseText);
                        if (data && data.clients && data.clients.length) {
                            var first = data.clients[0];
                            if (first && first.path) {
                                target = base + first.path + '/';
                            }
                        }
                    }
                };
                xhr.send(null);
            } catch (e) {}
            window.location.replace(target);
        })();
    </script>
</body>
</html>
