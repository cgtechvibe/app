<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Manager - Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>PWA Manager</h1>
      <p>Sign in to manage your web app collection</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-input" id="email" placeholder="admin@admin.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-input" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        <p id="loginError" style="color:var(--danger);font-size:13px;margin-top:12px;text-align:center;display:none;"></p>
      </form>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('pwa_user')) {
      window.location.href = 'dashboard.html';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';

      try {
        const res = await fetch(API_URL + '?action=login&email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password));
        const data = await res.json();

        if (data.ok) {
          localStorage.setItem('pwa_user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          errEl.textContent = 'Invalid email or password';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Check API URL.';
        errEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
